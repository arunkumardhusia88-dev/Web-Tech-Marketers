<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Webluxe</title>
    <meta name="description" content="Contact Webluxe for Digital Marketing, AI Chatbots, CRM Automation, and custom Web Development consultations." />
    <meta property="og:title" content="Contact Us — Webluxe" />
    <meta property="og:description" content="Contact Webluxe for Digital Marketing, AI Chatbots, CRM Automation, and custom Web Development consultations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body id="contact-page">
    <header class="site-header" id="site-header"></header>

    <main>
      <section class="page-hero">
        <div class="container">
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="/index.html">Home</a> <span aria-hidden="true">/</span>
            <strong style="color:var(--text-primary);">Contact</strong>
          </nav>
          <span class="hero-eyebrow">Direct Strategy Desk</span>
          <h1 class="display-title" style="max-width:22ch;margin-top:8px;">Get Your Free Growth &amp; AI Consultation</h1>
          <p class="hero-description" style="margin-top:14px;">Share your pipeline targets or automation workflows. Our senior team responds within 1 business hour.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="contact-grid">
            <div class="contact-info-panel" id="contact-page-info"></div>
            <div class="form-card">
              <form id="contact-page-form" novalidate>
                <div class="form-grid-2">
                  <div class="form-group">
                    <label class="form-label" for="cp-name">Full Name *</label>
                    <input id="cp-name" name="name" type="text" required class="input-control" placeholder="Rohan Sharma" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="cp-email">Work Email *</label>
                    <input id="cp-email" name="email" type="email" required class="input-control" placeholder="rohan@company.in" />
                  </div>
                </div>
                <div class="form-grid-2">
                  <div class="form-group">
                    <label class="form-label" for="cp-phone">Phone / WhatsApp *</label>
                    <input id="cp-phone" name="phone" type="tel" required class="input-control" placeholder="9115277587" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="cp-budget">Budget Range</label>
                    <select id="cp-budget" name="budget" class="input-control">
                      <option value="Launch Plan (₹9,999/mo)">Launch Plan (₹9,999/mo)</option>
                      <option value="Growth Plan (₹19,999/mo)">Growth Plan (₹19,999/mo)</option>
                      <option value="Scale Plan (Custom Pricing)">Scale Plan (Custom Pricing)</option>
                      <option value="One-Time Project">One-Time Project</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="cp-service">Service Needed *</label>
                  <select id="cp-service" name="service" class="input-control">
                    <option value="">Select primary service...</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="cp-message">Project Details *</label>
                  <textarea id="cp-message" name="message" required class="input-control" placeholder="Tell us about your website, ad spend, or workflow goals..."></textarea>
                </div>
                <div data-form-feedback style="font-size:0.875rem;margin-bottom:14px;min-height:20px;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Submit Consultation Request</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="/js/data.js" defer></script>
    <script src="/js/storage.js" defer></script>
    <script src="/js/main.js" defer></script>
  </body>
</html>
