<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Webluxe</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout" id="admin-dashboard-app">
      <!-- Sidebar Navigation -->
      <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar navigation">
        <div class="admin-brand-row">
          <a href="/index.html" class="brand-wordmark" style="font-size:1.1rem;">
            <span class="brand-mark-icon" aria-hidden="true">W</span>
            <span class="logo-text-group"><span class="logo-web">WEB</span><span class="logo-luxe">LUXE</span>&nbsp;<span>CMS</span></span>
          </a>
        </div>

        <div>
          <div class="admin-nav-group-label">Core</div>
          <div class="admin-nav-list">
            <button type="button" class="admin-nav-btn is-active" data-admin-tab="overview"><span>Dashboard Overview</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="leads"><span>Lead Management</span><span class="admin-nav-count" data-count-badge="leads">0</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="subscribers"><span>Newsletter Subscribers</span><span class="admin-nav-count" data-count-badge="subscribers">0</span></button>
          </div>
        </div>

        <div>
          <div class="admin-nav-group-label">Dynamic Pages &amp; Media</div>
          <div class="admin-nav-list">
            <button type="button" class="admin-nav-btn" data-admin-tab="services"><span>Services</span><span class="admin-nav-count" data-count-badge="services">0</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="portfolio"><span>Portfolio Projects</span><span class="admin-nav-count" data-count-badge="portfolio">0</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="blogs"><span>Blog &amp; Categories</span><span class="admin-nav-count" data-count-badge="blogs">0</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="media"><span>Image Manager</span><span class="admin-nav-count" data-count-badge="media">0</span></button>
          </div>
        </div>

        <div>
          <div class="admin-nav-group-label">Homepage Sections</div>
          <div class="admin-nav-list">
            <button type="button" class="admin-nav-btn" data-admin-tab="navbar"><span>Navbar</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="hero"><span>Hero Section</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="highlights"><span>Highlights Cards</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="about"><span>About Section</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="promo"><span>Promo Banner</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="pricing"><span>Pricing Packages</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="process"><span>Work Process</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="testimonials"><span>Testimonials</span><span class="admin-nav-count" data-count-badge="testimonials">0</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="faqs"><span>FAQ Management</span><span class="admin-nav-count" data-count-badge="faqs">0</span></button>
          </div>
        </div>

        <div>
          <div class="admin-nav-group-label">Configuration</div>
          <div class="admin-nav-list">
            <button type="button" class="admin-nav-btn" data-admin-tab="seo"><span>SEO &amp; Sitemap</span></button>
            <button type="button" class="admin-nav-btn" data-admin-tab="settings"><span>Site, Contact &amp; Footer</span></button>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <div class="admin-main">
        <header class="admin-topbar">
          <div style="display:flex;align-items:center;gap:12px;">
            <button type="button" class="icon-btn admin-mobile-menu-btn" id="admin-mob-menu-btn" aria-label="Toggle admin sidebar">☰</button>
            <div class="admin-breadcrumbs">
              <span>Admin</span> <span aria-hidden="true">/</span>
              <strong id="admin-breadcrumb-current">Dashboard Overview</strong>
            </div>
          </div>
          <div class="admin-topbar-actions">
            <button type="button" id="admin-theme-toggle" class="theme-toggle-btn" aria-label="Switch color theme"></button>
            <a href="/index.html" target="_blank" class="btn btn-secondary btn-sm">View Live Site</a>
            <button type="button" id="admin-reset-btn" class="btn btn-ghost btn-sm">Reset Demo</button>
            <button type="button" id="admin-logout-btn" class="btn btn-secondary btn-sm">Logout</button>
          </div>
        </header>

        <main class="admin-content" id="admin-viewport"></main>
      </div>
    </div>

    <!-- Reusable Admin Modal -->
    <div class="modal-backdrop" id="admin-modal">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
        <div class="modal-header">
          <h3 id="admin-modal-title">Edit Item</h3>
          <button type="button" class="icon-btn" id="admin-modal-close" aria-label="Close modal">✕</button>
        </div>
        <div id="admin-modal-body"></div>
      </div>
    </div>

    <script src="/js/data.js" defer></script>
    <script src="/js/storage.js" defer></script>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
